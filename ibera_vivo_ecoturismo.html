<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iberá Vivo | Ecoturismo</title>
  <style>
    :root{--deep:#123d35;--green:#236b52;--cream:#f7f5ec;--gold:#e6b85c;--ink:#18332d;--muted:#61756d}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}
    .landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 22px;position:relative;overflow:hidden;color:white;background:linear-gradient(115deg,rgba(9,43,37,.88),rgba(21,88,65,.68)),radial-gradient(ellipse at 75% 20%,#80a879 0%,#27614d 38%,#123d35 78%)}
    .landing:before,.landing:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.14);border-radius:50%;width:550px;height:550px}.landing:before{right:-150px;bottom:-300px}.landing:after{left:-260px;top:-350px;width:700px;height:700px}
    .hero{width:min(100%,980px);position:relative;z-index:1}.eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:.76rem;font-weight:700;color:#d9e8d5}h1{font-size:clamp(3.2rem,9vw,7rem);line-height:.94;letter-spacing:-.06em;margin:22px 0}.hero p{font-size:clamp(1.05rem,2vw,1.3rem);line-height:1.7;max-width:650px;color:#e6eee8}.pill{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:50px;padding:9px 15px;font-size:.85rem}.primary{border:0;background:var(--gold);color:#173c31;padding:15px 24px;border-radius:50px;font-weight:800;margin-top:20px;box-shadow:0 10px 25px #071d1838;transition:.2s}.primary:hover{transform:translateY(-3px);filter:brightness(1.06)}.site-note{font-size:.82rem;color:#c9d9d0;margin-top:26px}
    .presentation{display:none;min-height:100vh;background:var(--cream)}.topbar{height:68px;padding:0 clamp(18px,5vw,70px);display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e5e8df;position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:.06em;color:var(--deep)}.progress-wrap{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}.progress{width:min(22vw,170px);height:5px;border-radius:10px;background:#e3e9e2;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--green);transition:width .35s}.exit{border:1px solid #d7e1d8;background:white;border-radius:30px;padding:8px 13px;color:var(--deep)}
    .stage{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:clamp(12px,2vw,28px)}.slide{width:min(100%,1120px);min-height:min(720px,calc(100vh - 150px));display:none;place-items:center;animation:enter .55s ease both}.slide.active{display:grid}@keyframes enter{from{opacity:0;transform:translateX(35px) scale(.985)}to{opacity:1;transform:translateX(0) scale(1)}}
    .slide-image{display:block;width:100%;height:auto;max-height:calc(100vh - 155px);object-fit:contain;border-radius:12px;box-shadow:0 18px 45px rgba(18,61,53,.12);background:#fff}
    .nav{display:flex;justify-content:space-between;align-items:center;width:min(100%,1120px);margin:0 auto;padding:0 0 22px}.arrow{border:0;background:var(--deep);color:white;border-radius:50px;padding:13px 20px;font-weight:700;transition:.2s}.arrow:hover{background:var(--green);transform:translateY(-2px)}.arrow:disabled{opacity:.3;cursor:not-allowed;transform:none}.dots{display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border:0;border-radius:50%;background:#c7d2c8;padding:0}.dot.active{width:23px;border-radius:10px;background:var(--green)}
    @media(max-width:760px){.topbar{height:62px;padding:0 12px}.brand{font-size:.85rem}.progress-wrap{gap:7px}.progress{width:55px}.exit{padding:7px 9px;font-size:.8rem}.stage{min-height:calc(100vh - 62px);padding:8px}.slide{min-height:calc(100vh - 135px)}.slide-image{max-height:calc(100vh - 150px);border-radius:6px}.nav{padding:0 12px 14px}.arrow{padding:11px 13px;font-size:.85rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <section class="landing" id="home">
    <div class="hero">
      <span class="pill">ECOTURISMO · CORRIENTES, ARGENTINA</span>
      <div class="eyebrow" style="margin-top:34px">Una experiencia para conectar con la naturaleza</div>
      <h1>ESTEROS<br><span style="color:#e6c879">DEL IBERÁ</span></h1>
      <p>Recorré el destino, su fauna, su flora y las experiencias de ecoturismo a través de esta presentación.</p>
      <button class="primary" id="startBtn">Ver presentación <span aria-hidden="true">→</span></button>
      <div class="site-note">Explorá la propuesta · Usá las flechas para avanzar</div>
    </div>
  </section>

  <main class="presentation" id="presentation">
    <header class="topbar">
      <div class="brand">ESTEROS DEL IBERÁ</div>
      <div class="progress-wrap"><span id="counter">01 / 07</span><div class="progress"><span id="progressBar"></span></div></div>
      <button class="exit" id="exitBtn">Volver al inicio</button>
    </header>
    <div class="stage">
      <section class="slide active" data-title="Etapas del proyecto"><img class="slide-image" src="esteros%20ibera%20(1).png" alt="Etapas del proyecto y paquetes de ecoturismo"></section>
      <section class="slide" data-title="Nuestro destino"><img class="slide-image" src="esteros%20ibera%20(2).png" alt="Nuestro destino: Esteros del Iberá"></section>
      <section class="slide" data-title="Quiénes somos"><img class="slide-image" src="esteros%20ibera%20(3).png" alt="Quiénes somos"></section>
      <section class="slide" data-title="Esteros del Iberá"><img class="slide-image" src="esteros%20ibera%20(4).png" alt="Presentación Esteros del Iberá"></section>
      <section class="slide" data-title="Flora"><img class="slide-image" src="esteros%20ibera%20(5).png" alt="Flora del Iberá"></section>
      <section class="slide" data-title="Animales característicos"><img class="slide-image" src="esteros%20ibera%20(6).png" alt="Animales característicos del Iberá"></section>
      <section class="slide" data-title="Fauna"><img class="slide-image" src="esteros%20ibera%20(7).png" alt="Fauna del Iberá"></section>
    </section>
    </div>
    <nav class="nav" aria-label="Navegación de diapositivas">
      <button class="arrow" id="prevBtn">← Anterior</button><div class="dots" id="dots"></div><button class="arrow" id="nextBtn">Siguiente →</button>
    </nav>
  </main>
  <script>
    const home=document.getElementById('home'),presentation=document.getElementById('presentation'),slides=[...document.querySelectorAll('.slide')],counter=document.getElementById('counter'),progress=document.getElementById('progressBar'),dotsBox=document.getElementById('dots');let current=0;
    slides.forEach((slide,i)=>{const dot=document.createElement('button');dot.className='dot'+(i===0?' active':'');dot.type='button';dot.setAttribute('aria-label','Ir a la diapositiva '+(i+1)+': '+slide.dataset.title);dot.addEventListener('click',()=>showSlide(i));dotsBox.appendChild(dot)});
    function showSlide(index){if(index<0||index>=slides.length)return;slides[current].classList.remove('active');current=index;slides[current].classList.remove('active');void slides[current].offsetWidth;slides[current].classList.add('active');[...dotsBox.children].forEach((dot,i)=>dot.classList.toggle('active',i===current));counter.textContent=String(current+1).padStart(2,'0')+' / '+slides.length.toString().padStart(2,'0');progress.style.width=((current+1)/slides.length*100)+'%';document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===slides.length-1;if(presentation.style.display==='block')document.querySelector('.stage').scrollIntoView({behavior:'smooth',block:'start'})}
    function start(){home.style.display='none';presentation.style.display='block';showSlide(0);window.scrollTo({top:0,behavior:'smooth'})}function goHome(){presentation.style.display='none';home.style.display='flex';window.scrollTo({top:0,behavior:'smooth'})}
    document.getElementById('startBtn').addEventListener('click',start);document.getElementById('exitBtn').addEventListener('click',goHome);document.getElementById('prevBtn').addEventListener('click',()=>showSlide(current-1));document.getElementById('nextBtn').addEventListener('click',()=>showSlide(current+1));
    document.addEventListener('keydown',event=>{if(presentation.style.display!=='block')return;if(event.key==='ArrowRight')showSlide(current+1);if(event.key==='ArrowLeft')showSlide(current-1);if(event.key==='Escape')goHome()});showSlide(0);
  </script>
</body>
</html>
